name: Kiểm tra và đóng gói Windows
on:
  push:
    branches: [main, tien-hiep-v0.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Tải Godot từ nguồn chính thức
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo "/tmp/godot" >> "$GITHUB_PATH"
          mv /tmp/godot/Godot* /tmp/godot/godot
      - name: Nhập tài nguyên và kiểm tra
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit
          godot --headless --path . --script tests/kiem_thu.gd 2>&1 | tee /tmp/kiem-thu.log
          if grep -E 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/kiem-thu.log; then exit 1; fi
      - name: Tải mẫu xuất Windows
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -j -q /tmp/templates.tpz 'templates/windows_release_x86_64.exe' -d "$dest"
      - name: Xuất bản chơi Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/windows
          godot --headless --path . --export-release 'Windows Desktop' export/windows/HuyenMonTienLo.exe
          test -s export/windows/HuyenMonTienLo.exe
          test -s export/windows/HuyenMonTienLo.pck
          cp Huong_dan.md export/windows/Huong_dan.md
          cp fonts/Giay_phep_phong_chu.txt export/windows/Giay_phep_phong_chu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Huyen-Mon-Tien-Lo-Windows
          path: export/windows/
          if-no-files-found: error
          retention-days: 30
